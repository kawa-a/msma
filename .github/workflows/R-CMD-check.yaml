name: R-CMD-check

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: windows-latest, r: release }
          - { os: macos-latest, r: release }
          - { os: ubuntu-latest, r: release }
          - { os: ubuntu-latest, r: devel }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - name: Install build dependencies
        if: runner.os != 'macOS'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::roxygen2
            any::knitr
            any::rmarkdown
            any::testthat
          needs: check

      - name: Install build dependencies on macOS from source
        if: runner.os == 'macOS'
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          install.packages(
            c("roxygen2", "knitr", "rmarkdown", "testthat"),
            type = "source",
            dependencies = c("Depends", "Imports", "LinkingTo")
          )

      - name: Generate, build, install, and check package
        shell: Rscript {0}
        run: |
          source("create_4.0.R")

      - name: Show msma check log on failure
        if: failure()
        shell: Rscript {0}
        run: |
          log <- "msma.Rcheck/00check.log"
          if (file.exists(log)) {
            cat(readLines(log, warn = FALSE), sep = "\n")
          } else {
            cat("msma.Rcheck/00check.log was not created.\n")
          }

      - name: Upload check artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-${{ matrix.config.os }}-R-${{ matrix.config.r }}
          path: |
            msma.Rcheck/
            msma_4.0.tar.gz
          if-no-files-found: warn
